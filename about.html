<html>
    <head>
     <meta charset="utf-8">
     <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
    <style>
      *, *::before, *::after {
        box-sizing: border-box;
      }

      * {
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      }

      body {
        margin: 0;
      }

            h2 {
        margin-top: 50px;
        margin-bottom: 10px;
      }

      h3,h4 {
        margin-top:0.5em;
        margin-bottom:0.5em;
      }

      table {
        border-collapse: collapse;
        width: 100%
      }

      th {
        background: #ecf1f6;
      }

      td,
      th {
        border: 1px solid #cfd8df;
        padding: 5px 10px;
      }

      tr {
        height: 38px;
      }

      ul {
        list-style-type: '-  ';
        padding-left: 15px;
        margin: 0;
      }

      a {
        text-decoration: none;
        color: #24699E;
      }

      a:hover {
        color: #4C93C9;
      }

      .nowrap {
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      #page-header {
        display: flex;
        align-items: center;
        padding: 14px clamp(20px, 10%, 64px);
        border-bottom: 1px solid #e4edf2;
      }

      #page-header a {
        color: #24699E;
        font-weight: 500;
        text-decoration: none;
        transition: color 0.15s ease-out;
        font-size: 18px;
      }

      #page-header a:hover {
        color: #4C93C9;
      }

      #section-about {
        margin: 40px 10%;
        color: #2d3d4a;
        line-height: 1.65;
      }

      #section-about h1 {
        font-size: 1.6em;
        font-weight: 700;
        color: #5b778c;
        margin: 0 0 16px;
      }

      #section-about h2 {
        font-size: 1.1em;
        font-weight: 700;
        color: #5b778c;
        margin: 2em 0 0.5em;
      }

      #section-about p {
        font-size: 0.875em;
        margin: 0 0 0.75em;
      }

      #section-about ul {
        font-size: 0.875em;
        list-style-type: '- ';
        padding-left: 15px;
        margin: 0 0 0.75em;
      }

      #section-about li {
        margin-bottom: 0.4em;
        padding-left: 4px;
      }

      #section-about a {
        text-decoration: underline;
      }

      #nav-about {
        margin-left: auto;
      }
    </style>
 </head>
    <body>
        <nav id="page-header">
          <a href="./">← Back to main page</a>
        </nav>
        <div id="section-about">
        <h1>This is a prototype Genomic Resource Repository for single-cell data aggregated by the NYGC for their machine-learning initiative</h1>

        </div>
    </body>
</html>
