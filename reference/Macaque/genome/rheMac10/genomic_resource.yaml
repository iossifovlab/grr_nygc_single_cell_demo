meta:

  summary: |
    Rhesus macaque (Macaca mulatta) genome assembly

  description: |

    UCSC rheMac10 genome assembly for the rhesus macaque (Macaca mulatta), corresponding to the Mmul\_10 assembly (GCF\_003339765.1), in FASTA format.

    Sequence names use the UCSC chromosome naming convention (chr1, chr2, etc.).

    Downloaded from: https://hgdownload.soe.ucsc.edu/goldenPath/rheMac10/bigZips/rheMac10.fa.gz

    Downloaded on: 9/17/2026

    Downloaded gzip was decompressed and recompressed with bgzip and indexed with samtools faidx.