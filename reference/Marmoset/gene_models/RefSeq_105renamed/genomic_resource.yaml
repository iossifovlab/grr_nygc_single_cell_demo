type: gene_models

filename: renamed.txt.gz
format: default

meta:
  summary: |
    Marmoset (Callithrix jacchus) RefSeq Annotation Release 105 gene models

  description: |

    NCBI RefSeq gene models for the common marmoset (Callithrix jacchus), Annotation Release 105, on the Callithrix\_jacchus\_cj1700\_1.1 genome assembly (GCF\_009663435.1; calJac4).

    Zemke et al. (2023) used the cj1700\_1.1 (calJac4) marmoset genome assembly and reported the annotation as GCA\_009663435.2. The exact GTF file used in the study was not specified. This resource provides NCBI RefSeq Annotation Release 105 for the corresponding cj1700\_1.1 RefSeq assembly, GCF\_009663435.1.

    Downloaded from: https://ftp.ncbi.nlm.nih.gov/genomes/all/GCF/009/663/435/GCF\_009663435.1\_Callithrix\_jacchus\_cj1700\_1.1/GCF\_009663435.1\_Callithrix\_jacchus\_cj1700\_1.1\_genomic.gtf.gz

    Download date: 9/14/2026

    Sequence names in the downloaded GTF were renamed to the UCSC calJac4 chromosome naming convention using the official UCSC chromosome alias file:

    https://hgdownload.soe.ucsc.edu/goldenPath/calJac4/bigZips/calJac4.chromAlias.txt

    Only the sequence names in the first column of the GTF were changed. Gene models, transcript and gene identifiers, genomic coordinates, strand information, and annotation attributes were otherwise preserved.

    The renamed GTF was transformed to GAIn format by:
    to\_gpf\_gene\_models\_format renamed.gtf.gz renamed.txt.gz

  labels:
    reference_genome: reference/Marmoset/genome/calJac4