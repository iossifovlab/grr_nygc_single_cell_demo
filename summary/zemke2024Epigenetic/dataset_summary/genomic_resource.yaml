meta:

  summary: |
    Zemke et al, Epigenetic and 3D genome reprogramming during the aging of human hippocampus, bioRxiv 2024

  description: |
    The study presents a single-nucleus multiomic analysis of the human hippocampus across adult aging, using tissue from 40 neurotypical donors spanning ages 20 to 100 years. It examines age-associated changes in hippocampal cell populations and their molecular and regulatory states, integrating gene expression, chromatin accessibility, DNA methylation, and 3D genome organization to characterize how the human hippocampus changes across the lifespan.

    The study uses two complementary assays. 10x Multiome jointly measures gene expression and chromatin accessibility, covering 295,033 nuclei organized into 18 cell subclasses, while snm3C-seq measures DNA methylation and 3D chromatin conformation, covering 22,240 nuclei organized into 13 cell subclasses. Donors were divided into four age groups: 20-40, 40-60, 60-80, and 80-100 years, allowing molecular and regulatory features to be compared across different stages of aging.

    [Zemke et al, Epigenetic and 3D genome reprogramming during the aging of human hippocampus, bioRxiv 2024.](https://www.biorxiv.org/content/10.1101/2024.10.14.618338v1)

