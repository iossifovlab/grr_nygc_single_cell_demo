    The data are organized into five main resource groups. **atac\_fragments** and **rna\_expression\_atac\_matrix** each contain 40 donor-level resources, corresponding to the 40 individuals in the study. atac_fragments contains the single-nucleus chromatin-accessibility fragment data generated by 10x Multiome, while rna\_expression\_atac\_matrix contains the corresponding single-nucleus RNA expression matrices. The same donor identifiers are used in both collections.

    **pseudobulk\_atac** and **pseudobulk\_rna** each contain 92 cell-type- and age-resolved bigWig tracks generated by aggregating nuclei from the corresponding cell populations. The 18 main cell subclasses represented are Astro, CA1, CA2-CA3, Chandelier, DG, Endo, LAMP5, Macro, Microglia, NR2F2, Oligo, OPC, PVALB, SST, SUB, T-Cell, VIP, and VLMC. The GRR also includes four finer, analysis-derived states within the astrocyte and microglia populations: Astro1, Astro2, Micro1, and Micro2. For most of the 18 main subclasses, five pseudobulk tracks are provided: one combining all ages and four corresponding to the age groups age20-40, age40-60, age60-80, and age80-100. CA2-CA3 and DG have only four tracks because the age80-100 group is absent, while the four finer states are represented only by an all track and are not subdivided by age group. This results in 92 pseudobulk ATAC and 92 pseudobulk RNA resources.

    The **supplementary\_table** collection contains 24 resources corresponding to supplementary tables S1-S24. The snm3C-seq data described in the paper are not included.
