file: zemke2024_annotated_barcode_namespace.csv.gz
format: csv
type: data_frame

meta:
  summary: Cell barcodes and cell-type annotations for Zemke 2024

  description: |
    Author-provided GEO cell metadata
    ([GSE278576 metadata](https://ftp.ncbi.nlm.nih.gov/geo/series/GSE278nnn/GSE278576/suppl/GSE278576_hippocampus_RNA_seurat_object_filtered_cells_metadata.tsv.gz))
    were used as the source of per-cell subclass annotations. Sample identity
    was taken from orig.ident, and the GRR barcode was derived from the final
    underscore-separated component of the original GEO cell identifier. The
    original GEO identifier was retained as bacrode\_GEO.

    The resulting table contains 295,033 annotated cells from 40 samples.
    All annotated barcodes were verified against both the RNA+ATAC matrices
    and ATAC-fragment resources, with no missing barcodes in either modality.

     
    For harmonization across the barcode resources, **sample\_id and class were used as common namespace columns; sample\_id corresponds to the sample identity from orig.ident, and class is equivalent to subclass.

    | sample_id | bacrode_GEO | barcode | class | subclass |
    | --- | --- | --- | --- | --- |
    | hc1134 | hc1134_AAACAGCCATTATCCC-1 | AAACAGCCATTATCCC-1 | Oligo | Oligo |
    | hc1134 | hc1134_AAACATGCAATGCGCT-1 | AAACATGCAATGCGCT-1 | Microglia | Microglia |
    | hc1134 | hc1134_AAACATGCATAATGTC-1 | AAACATGCATAATGTC-1 | DG | DG |

    Prepared on 2026-09-28.

    Processing details: The table can be regenerated by running
    barcodes\_zemke24.py. This produces
    zemke2024\_annotated\_barcode\_namespace.csv.gz. The extended validation
    can be rerun by setting RUN\_EXTENDED\_VALIDATION = True in the script.