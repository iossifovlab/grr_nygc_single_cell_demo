file: johansen2025_annotated_barcode_namespace.csv.gz
format: csv
type: data_frame

meta:
  summary: Cell barcodes and cell-type annotations for Johansen 2025

  description: |
    Annotated cells were obtained from the Human, Macaque, and Marmoset
    comprehensive RNA-expression matrix resources. These resources contain
    the cell barcode, sample identity, and cell-type annotations directly in
    AnnData.obs, including Neighborhood, Class, Subclass, Group, and Cluster.
    The AnnData index was retained as cell\_label. The resulting table contains
    1,896,133 annotated cells.

    An ATAC-specific cell identifier, atac\_cell\_id, is also provided. For
    Human and Marmoset, this identifier corresponds to the full cell\_label.
    For Macaque, ATAC fragment files use the cell barcode with a trailing
    “-1”. Representative examples are shown below.

    | species | sample | cell\_label | cell\_barcode | atac\_cell\_id | Neighborhood | Class | Subclass | Group | Cluster |
    | --- | --- | --- | --- | --- | --- | --- | --- | --- | --- |
    | Human | 2362\_A05 | AAACAGCCAAATGCCC-2362\_A05 | AAACAGCCAAATGCCC | AAACAGCCAAATGCCC-2362\_A05 | Nonneuron | Vascular | VLMC | VLMC | Human-451 |
    | Macaque | 1061\_B04 | AAACAGCCAGTTGCGT-1061\_B04 | AAACAGCCAGTTGCGT | AAACAGCCAGTTGCGT-1 | Subpallium GABA | CN LGE GABA | STR D1 MSN | STRv D1 MSN | Macaque-1 |
    | Marmoset | P0005\_1 | GTTCCTGGTTAGCATG-P0005\_1 | GTTCCTGGTTAGCATG |  | Nonneuron | OPC-Oligo | Oligodendrocyte | Oligo OPALIN | Marmoset-1 |

    ATAC-resource availability was determined using the corresponding
    cell metadata. All Human and Macaque annotated cells were associated
    with available ATAC fragment resources. Of the 313,033 Marmoset cells,
    294,480 were associated with an available ATAC resource, while 18,553
    belonged to samples without an ATAC fragment resource. For those
    18,553 cells, atac\_cell\_id is left blank. Representative ATAC fragment
    resources from each species were checked directly to confirm the
    species-specific identifier conventions.

    Prepared on 2026-09-28.

    Processing details: The table can be regenerated by running
    barcodes\_johansen25.py. This produces
    johansen2025\_annotated\_barcode\_namespace.csv. The extended validation
    can be rerun by setting RUN\_EXTENDED\_VALIDATION = True in the script.