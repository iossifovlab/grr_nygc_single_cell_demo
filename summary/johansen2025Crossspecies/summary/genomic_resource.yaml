  summary: |
    Johannssen et al, Cross-species single-nucleus multiomic atlas of the basal ganglia, bioRxiv 2025

  description: |
    The study presents a cross-species single-nucleus multiomic atlas of the basal ganglia in human, macaque, and marmoset, covering eight major structures: caudate, putamen, nucleus accumbens, ventral pallidum, external globus pallidus, internal globus pallidus, subthalamic nucleus, and substantia nigra. It characterizes the molecular and regulatory organization of cell populations across these three primate species and integrates the main single-nucleus dataset with spatial gene-expression data and macaque Patch-seq measurements.

    The main dataset was generated using 10x Multiome, which jointly measures RNA expression and ATAC chromatin accessibility in the same nuclei. The study includes 518 individual 10x Multiome library preparations: 204 from human, 90 from macaque, and 224 from marmoset. Species-wide expression matrices retain a hierarchical cell taxonomy including Neighborhood, Class, Subclass, Group, and Cluster annotations. 

    [Johannssen, et al, Cross-species single-nucleus multiomic atlas of the basal ganglia, bioRxiv 2025.](https://www.biorxiv.org/content/10.64898/2025.12.15.694496v1)