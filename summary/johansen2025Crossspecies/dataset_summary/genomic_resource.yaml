    The data are organized into six main resource groups. **comprehensive\_rna\_expression\_matrix** contains three species-level AnnData resources, one each for human, macaque, and marmoset, providing comprehensive RNA expression matrices from the 10x Genomics dataset.

    **rna\_expression\_matrix** contains 15 AnnData resources representing several expression datasets used in the study. These include species-specific 10x Multiome RNA expression matrices in raw and log2-transformed form, cross-species aligned 10x expression matrices, macaque Patch-seq data, human and macaque MERSCOPE spatial expression data, and marmoset Xenium spatial expression data.

    **rna\_expression\_metadata** contains 73 tabular resources associated with these expression datasets, including cell, donor, library, gene, taxonomy, anatomical, and other supporting annotations.

    **atac\_fragments** contains 518 sample-level ATAC fragment resources generated by 10x Multiome: 204 human, 90 macaque, and 224 marmoset resources. Each resource contains chromatin-accessibility fragments from an individual library preparation.

    **pseudobulk\_atac** contains 169 cell-type-specific bigWig resources derived from the 10x Multiome ATAC data: 60 human, 58 macaque, and 51 marmoset tracks. These represent chromatin-accessibility signal aggregated across nuclei belonging to the same annotated cell type.

    The **supplementary\_table** collection contains 53 resources derived from the supplementary tables and associated subdivisions provided with the study.
