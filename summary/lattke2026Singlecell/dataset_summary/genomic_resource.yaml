        The data are organized into five main resource groups. **rna\_expression\_matrix** contains a single AnnData resource with RNA expression measurements for 248,998 nuclei across 35,477 genes. The nuclei originate from 30 fetal cortex samples collected from 30 donors, including 15 Down syndrome and 15 controls, and are represented by 37 sequencing libraries. Cell annotations include donor and sample identifiers, developmental stage, disease status, and cell-type classifications comprising nine broad cell classes, 15 author-defined cell types, and 21 clusters.

        **atac\_fragments** contains a single resource with chromatin-accessibility fragments generated by 10x Multiome. Each fragment record specifies genomic coordinates, a cell barcode, and a count. The fragment barcodes can be linked to cell-type and sample annotations through **10x\_multiomics\_cell\_meta\_data**.

        **10x\_multiomics\_cell\_meta\_data** contains cell-level annotations for the 248,998 nuclei, including barcodes, sample and donor identifiers, Down syndrome or control status, and cell-type classifications. Its barcodes, sample assignments, donor assignments, and condition labels correspond exactly to those in the RNA expression matrix.

        **samples\_meta\_data** contains metadata for the 30 fetal cortex samples, including donor and sample identifiers, disease status, tissue, sex, and developmental stage. The collection represents 15 Down syndrome and 15 control samples spanning postconceptional weeks 10 to 20.

        The **supplementary\_table** collection contains 60 resources corresponding to supplementary tables S1–S6 and their subdivisions. These include sample and library metadata and quality-control metrics (S1), differential gene expression analyses (S2–S3), gene-regulatory network analyses and transcription factor interactions (S4), results from iPSC-derived neural cell models and antisense oligonucleotide experiments (S5), and analyses of transplanted neural cell grafts (S6).
        
