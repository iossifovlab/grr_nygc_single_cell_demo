meta:
    summary: lattke2026Singlecell
    description: |
        Lattke et al. present a single-nucleus multiomic atlas of the developing human cerebral cortex in Down syndrome, examining how trisomy 21 affects cell populations and gene-regulatory programs during fetal development. The study investigates differences between Down syndrome and control tissues, with particular attention to excitatory neuronal development and the transcriptional regulatory mechanisms underlying altered cell states.

        Using 10x Multiome, the authors jointly measured RNA expression and chromatin accessibility in the same nuclei. The GRR contains data for 248,998 nuclei from 30 fetal cortex samples collected from 30 donors, including 15 Down syndrome and 15 controls, spanning postconceptional weeks 10 to 20. The 30 samples are represented by 37 sequencing libraries. The RNA expression matrix contains 35,477 genes, with nuclei organized into 9 broad cell classes, 15 author-defined cell types, and 21 clusters.

        [Lattke et al., Single-Cell Multiomic Atlas of Human Cortical Development in Down Syndrome, Nature Medicine, 2026](https://doi.org/10.1038/s41591-026-04211-1)


