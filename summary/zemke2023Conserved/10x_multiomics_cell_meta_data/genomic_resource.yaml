file: zemke2023_annotated_barcode_namespace.csv.gz
format: csv
type: data_frame

meta:
  summary: Cell barcodes and cell-type annotations for Zemke 2023

  description: |
    Annotated cells and subclass assignments were obtained from the Human,
    Macaque, Marmoset, and Mouse
    [GRR RNA-expression matrices](https://nygc-demo-grr.iossifovlab.com/index.html#/summary/zemke2023Conserved/rna_expression_matrix).
    RNA sample names were compared with the canonical namespace in the
    sample-description table sample\_description\_Ivan260918\_zemke23.txt.
    Eight Mouse RNA resource names required canonicalization; these mappings
    are explicitly checked during processing.

    The sample-description table was also used to associate each canonical
    sample with the corresponding RNA+ATAC matrix and ATAC-fragment resource
    names. These modality-specific names are retained because resource names
    are not always identical across modalities.

    | species | canonical\_sample | rna\_expression\_matrix | rna\_expression\_atac\_matrix | atac\_fragments | cell | barcode | subclass |
    | --- | --- | --- | --- | --- | --- | --- | --- |
    | human | M1\_donor1 | M1\_donor1 | M1\_donor1 | M1\_donor1\_deep2 | M1\_donor1\_AAACAGCCAACAACAA-1 | AAACAGCCAACAACAA-1 | ODC |
    | human | M1\_donor1 | M1\_donor1 | M1\_donor1 | M1\_donor1\_deep2 | M1\_donor1\_AAACAGCCAGGTATTT-1 | AAACAGCCAGGTATTT-1 | ODC |
    | human | M1\_donor1 | M1\_donor1 | M1\_donor1 | M1\_donor1\_deep2 | M1\_donor1\_AAACATGCAGGTTACC-1 | AAACATGCAGGTTACC-1 | PVALB |

    Extended validation confirmed that all 157,424 annotated barcodes were
    present in their corresponding RNA+ATAC matrix resources. For samples with
    an ATAC-fragment resource, all 155,872 expected annotated barcodes were
    also found in the corresponding fragment resources, with no missing
    barcodes. The remaining 1,552 annotated cells belong to
    M1\_donor3\_rep2, for which no ATAC-fragment resource is listed.

    Prepared on 2026-09-24.

    Processing details: The table can be regenerated by running
    barcodes\_zemke23.py. This produces
    zemke2023\_annotated\_barcode\_namespace.csv. The extended validation
    can be rerun by setting RUN\_EXTENDED\_VALIDATION = True in the script.