    The data are organized into eight resource groups. **atac_fragments** currently contains 22 sample-level resources with chromatin-accessibility fragment data generated by 10x Multiome. Each fragment record gives the genomic location of an ATAC fragment and the nucleus it came from.

    **rna\_expression\_atac\_matrix** contains 23 sample-level resources corresponding to the 23 10x Multiome sample/library preparations. Each resource contains a joint RNA-expression and ATAC-peak matrix for individual nuclei.

    **rna\_expression\_matrix** contains four species-level RNA expression matrices corresponding to human, macaque, marmoset, and mouse. Each matrix combines nuclei from multiple samples of the same species and includes cell-level annotations such as sample identity and cell subclass.

    **pseudobulk\_atac** and **pseudobulk\_rna** each contain 80 cell-type-specific bigWig resources derived from the 10x Multiome data. For each modality, 20 cell types are represented in each of the four species, giving 20 × 4 = 80 resources. The ATAC tracks represent chromatin-accessibility signal aggregated across nuclei of the same cell type, while the RNA tracks represent aggregated RNA-sequencing coverage for the corresponding cell populations.

    **pseudobulk\_methylation** contains 160 resources derived from the snm3C-seq data. For each of the four species, 20 cell types are represented, with separate CGN and CHN methylation tracks for each cell type, giving 20 × 2 × 4 = 160 resources.

    **pseudobulk_hic** contains 80 Hi-C resources derived from the snm3C-seq data, with 20 cell types represented in each of the four species. These resources contain 3D chromatin-contact data aggregated by cell type. Note that the cell-type labels used for the methylation and Hi-C resources are different from those used for the pseudobulk RNA and ATAC resources.

    The **supplementary\_table** collection contains 47 resources corresponding to the supplementary tables and their subdivisions provided with the study.

