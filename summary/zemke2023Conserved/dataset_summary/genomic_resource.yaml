
type: basic


meta:
  summary: | 
    Zemke et al, Conserved and divergent gene regulatory programs of the mammalian neocortex, Nature 2023

  description: |

    The study presents a cross-species single-nucleus multiomic analysis of the primary motor cortex in human, macaque, marmoset, and mouse (M1 in the primate species and MOp in mouse). It examines how cell-type-specific molecular and regulatory features of the motor cortex are conserved or have diverged across mammalian evolution. By integrating several genomic modalities across corresponding cell subclasses, the study provides a comparative view of transcriptional regulation, chromatin state, DNA methylation, and 3D genome organization across the four species.

    The study uses two complementary assays. 10x Multiome jointly measures gene expression and chromatin accessibility, covering 157,424 nuclei, while snm3C-seq measures DNA methylation and 3D chromatin conformation, covering 24,283 nuclei. The 10x Multiome data come from 23 sample/library preparations distributed across the four species, and the cells are organized into 21 major subclasses spanning excitatory neurons, inhibitory neurons, and non-neuronal cell types. These matched subclasses form the basis for comparing molecular and regulatory features across species.

    [Zemke et al, Conserved and divergent gene regulatory programs of the
    mammalian neocortex, Nature 2023.](https://www.nature.com/articles/s41586-023-06819-6)

