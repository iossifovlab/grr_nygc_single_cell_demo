                    event.target.style.display = "none";
                    document.currentOpenModal = null;
                }
            });

            document.addEventListener("keydown", function (event) {
                if (event.key === "Escape" && document.currentOpenModal) {
                    document.currentOpenModal.style.display = "none";

<style>
  /* The class is added by the script, so the pointer and the indicator
     only appear on a header the script actually wired up. */
  th.sortable {
    cursor: pointer;
    user-select: none;
    white-space: nowrap;
  }

  th.sortable .sort-indicator {
    font-size: 1.1em;
    vertical-align: middle;
    opacity: 0.35;
  }

  /* Shown on every sortable header at all times, dimmed until it is the
     one doing the sorting.  A page this static gives no other hint that
     a header is clickable, and a permanently visible marker also means
     the sorted column is identifiable at a glance rather than by
     reading which way an arrow points.

     Selected off aria-sort rather than a second class: equal
     specificity to the rule above, so source order decides, and the
     sorted column has exactly one piece of state. */
  th[aria-sort] .sort-indicator {
    opacity: 1;
  }
</style>
<script>
(function () {
    "use strict";

    var IDLE = "unfold_more";
    var ASCENDING = "arrow_upward";
    var DESCENDING = "arrow_downward";

    function keyOf(row, index, kind) {
        var cell = row.cells[index];
        var raw = cell ? cell.getAttribute("data-sort-value") : null;
        // Absent and empty both mean "no value".  A number column would
        // get the empty case for free from parseFloat, but on a text
        // column "" is a perfectly good key that sorts first ascending
        // -- and "no value" meaning two different things depending on
        // the column is not a distinction anyone wants to debug.
        if (raw === null || raw === "") {
            return null;
        }
        if (kind !== "number") {
            return raw;
        }
        var parsed = parseFloat(raw);
        return isNaN(parsed) ? null : parsed;
    }

    function compare(a, b, direction) {
        // "No value" is not a value: a row without one sits at the
        // bottom whichever way the column points, rather than sorting
        // as 0 or as the empty string and landing among real data.
        if (a === null || b === null) {
            if (a === b) {
                return 0;
            }
            return a === null ? 1 : -1;
        }
        if (a < b) {
            return -direction;
        }
        if (a > b) {
            return direction;
        }
        return 0;
    }

    function mark(header, glyph) {
        var indicator = header.querySelector(".sort-indicator");
        if (indicator) {
            indicator.textContent = glyph;
        }
    }

    function sortBy(table, header) {
        // aria-sort is the ONLY record of which column is sorted and
        // which way.  It is the screen-reader state, the CSS hook that
        // brings the indicator to full strength, and what this reads to
        // decide the next direction -- one attribute, so those three
        // cannot drift apart.  Two states, never three: the order the
        // page arrived in is the statistics file's insertion order, so
        // an "unsorted" state would only be a way back to noise.
        var direction = (
            header.getAttribute("aria-sort") === "ascending" ? -1 : 1);
        var index = header.cellIndex;
        var kind = header.dataset.sort;
        var body = table.tBodies[0];
        // Keys read once per row, rather than twice per comparison: a
        // few hundred contigs is a few thousand comparisons.
        var entries = Array.prototype.map.call(body.rows, function (row) {
            return {row: row, key: keyOf(row, index, kind)};
        });

        // Array.prototype.sort is stable as of ES2019, so tied rows keep
        // the order they are in NOW -- the rendered natural chromosome
        // order on the first sort, and whatever the previous sort left
        // behind on any sort after that.
        entries.sort(function (left, right) {
            return compare(left.key, right.key, direction);
        });
        entries.forEach(function (entry) {
            body.appendChild(entry.row);
        });

        var previous = table.tHead.querySelector("th[aria-sort]");
        if (previous) {
            previous.removeAttribute("aria-sort");
            mark(previous, IDLE);
        }
        header.setAttribute(
            "aria-sort", direction === 1 ? "ascending" : "descending");
        mark(header, direction === 1 ? ASCENDING : DESCENDING);
    }

    function enable(table) {
        // Only the rows in <tbody> ever move, so the "all chromosomes"
        // total cannot be displaced by any comparator.  It is pinned as
        // a SECOND <thead> row (gain#1118, moved there from <tfoot> so
        // it stays visible while the table scrolls), and this reads
        // headers from rows[0] alone -- so the total is outside both
        // the row set that moves and the cells that become sortable,
        // which is the same guarantee <tfoot> gave for the same reason.
        // The caller already matched "thead th[data-sort]", so a <thead>
        // with a row in it is the one thing we do not have to check.
        if (!table.tBodies[0]) {
            return;
        }
        Array.prototype.forEach.call(
            table.tHead.rows[0].cells,
            function (header) {
                if (!header.dataset.sort) {
                    return;
                }
                var indicator = document.createElement("span");
                indicator.className = (
                    "material-symbols-outlined sort-indicator");
                indicator.textContent = IDLE;
                // Hidden from assistive tech: it is a picture of the
                // state aria-sort states properly, and unhidden the
                // header reads as "Chromosomeunfold_more".
                indicator.setAttribute("aria-hidden", "true");
                header.appendChild(indicator);
                header.classList.add("sortable");
                // No role="button": that would REPLACE the <th>'s
                // implicit columnheader role and stop the whole table
                // being announced as having column headers.  tabindex
                // plus the keydown handler below is what makes it
                // operable; aria-sort is what reports the state.
                header.setAttribute("tabindex", "0");
                header.addEventListener("click", function () {
                    sortBy(table, header);
                });
                header.addEventListener("keydown", function (event) {
                    if (event.key === "Enter" || event.key === " ") {
                        event.preventDefault();
                        sortBy(table, header);
                    }
                });
            });
    }

    // The indicator is injected rather than rendered by the templates:
    // it advertises a click that only works if this script ran, and it
    // keeps the opt-in contract to the two data attributes.
    document.addEventListener("DOMContentLoaded", function () {
        document.querySelectorAll("table").forEach(function (table) {
            if (table.querySelector("thead th[data-sort]")) {
                enable(table);
            }
        });
    });
}());
</script>

                            <p>The study presents a cross-species single-nucleus multiomic analysis of the primary motor cortex in human, macaque, marmoset, and mouse (M1 in the primate species and MOp in mouse). It examines how cell-type-specific molecular and regulatory features of the motor cortex are conserved or have diverged across mammalian evolution. By integrating several genomic modalities across corresponding cell subclasses, the study provides a comparative view of transcriptional regulation, chromatin state, DNA methylation, and 3D genome organization across the four species.</p>

<p>The study uses two complementary assays. 10x Multiome jointly measures gene expression and chromatin accessibility, covering 157,424 nuclei, while snm3C-seq measures DNA methylation and 3D chromatin conformation, covering 24,283 nuclei. The 10x Multiome data come from 23 sample/library preparations distributed across the four species, and the cells are organized into 21 major subclasses spanning excitatory neurons, inhibitory neurons, and non-neuronal cell types. These matched subclasses form the basis for comparing molecular and regulatory features across species.</p>

<p><a href="https://www.nature.com/articles/s41586-023-06819-6">Zemke et al, Conserved and divergent gene regulatory programs of the
mammalian neocortex, Nature 2023.</a></p>

<p>The data are organized into eight resource groups. <strong>atac_fragments</strong> currently contains 22 sample-level resources with chromatin-accessibility fragment data generated by 10x Multiome. Each fragment record gives the genomic location of an ATAC fragment and the nucleus it came from.</p>

<p><strong>rna_expression_atac_matrix</strong> contains 23 sample-level resources corresponding to the 23 10x Multiome sample/library preparations. Each resource contains a joint RNA-expression and ATAC-peak matrix for individual nuclei.</p>

<p><strong>rna_expression_matrix</strong> contains four species-level RNA expression matrices corresponding to human, macaque, marmoset, and mouse. Each matrix combines nuclei from multiple samples of the same species and includes cell-level annotations such as sample identity and cell subclass.</p>

<p><strong>pseudobulk_atac</strong> and <strong>pseudobulk_rna</strong> each contain 80 cell-type-specific bigWig resources derived from the 10x Multiome data. For each modality, 20 cell types are represented in each of the four species, giving 20 × 4 = 80 resources. The ATAC tracks represent chromatin-accessibility signal aggregated across nuclei of the same cell type, while the RNA tracks represent aggregated RNA-sequencing coverage for the corresponding cell populations.</p>

<p><strong>pseudobulk_methylation</strong> contains 160 resources derived from the snm3C-seq data. For each of the four species, 20 cell types are represented, with separate CGN and CHN methylation tracks for each cell type, giving 20 × 2 × 4 = 160 resources.</p>

<p><strong>pseudobulk_hic</strong> contains 80 Hi-C resources derived from the snm3C-seq data, with 20 cell types represented in each of the four species. These resources contain 3D chromatin-contact data aggregated by cell type. Note that the cell-type labels used for the methylation and Hi-C resources are different from those used for the pseudobulk RNA and ATAC resources.</p>

<p>The <strong>supplementary_table</strong> collection contains 47 resources corresponding to the supplementary tables and their subdivisions provided with the study.</p>
