type: fragment_score
table:
  filename: GSM5589346_adipose_omentum_SM-CSSD4_rep1_fragments.bed.gz
  format: tabix
  header_mode: none
  zero_based: true
  chrom:
    column_index: 0
  pos_begin:
    column_index: 1
  pos_end:
    column_index: 2
scores:
- id: cell
  column_index: 3
  type: str
  histogram:
    type: categorical
    plot_function: fragment_count_dist_plot.py:plot_fragment_per_cell_count
    displayed_values_count: 5
- id: count
  column_index: 4
  type: int
  histogram:
    type: number
    view_range:
      min: 1
      max: 20
    number_of_bins: 20
meta:
  summary: Genome binding/occupancy profiling by high throughput sequencing/adipose_omentum_SM-CSSD4
  description: '


    [Zhang et al., A single-cell atlas of chromatin accessibility in the human genome
    , Cell, 2021](https://www.sciencedirect.com/science/article/pii/S0092867421012794)


    Downloaded from: [https://www.ncbi.nlm.nih.gov/geo/query/acc.cgi?acc=GSE184462
    ](https://www.ncbi.nlm.nih.gov/geo/query/acc.cgi?acc=GSE184462 )


    '
  labels:
    assay: sci-ATAC-seq
    modalities: ATAC
    data_type: fragments
    species: human
    sample_id: GSM5589346
    donor_id: SAMN21523867
    tissue: adipose omentum
    sequencing_platform: Illumina
    reference_genome: reference/Human/genome/GRCh38.p13
    dataset: zhang2021Singlecell
