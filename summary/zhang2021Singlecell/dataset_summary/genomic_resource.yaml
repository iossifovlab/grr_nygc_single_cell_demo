type: basic

meta:
  summary: >-
    Zhang et al., A single-cell atlas of chromatin accessibility in the human genome, Cell, 2021
  description: |
    Zhang and colleagues profiled chromatin accessibility in postmortem human tissue to identify which candidate cis-regulatory elements (cCREs) are accessible in different cell types. The authors combined their adult data with published profiles from 15 fetal tissue types to map 1,154,611 candidate elements across 222 adult and fetal cell types. They used the atlas to identify cell types in which noncoding variants associated with complex traits and diseases were enriched.

    The study used combinatorial indexing single-nucleus ATAC-seq (sci-ATAC-seq) on 92 biosamples from 30 adult tissue types and reported 615,998 nuclei that passed quality control. The GRR provides 72 adult ATAC fragment resources and annotations for 499,514 nuclei across 111 cell types. The local sample table covers 26 tissue labels and five donors aged 25–54. The 222 aggregate accessibility tracks cover both adult and fetal cell types.

    [Zhang *et al.*, A single-cell atlas of chromatin accessibility in the human genome, Cell, 2021.](https://doi.org/10.1016/j.cell.2021.10.024)

