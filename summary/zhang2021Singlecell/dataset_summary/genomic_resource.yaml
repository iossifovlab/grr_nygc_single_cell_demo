    **atac\_fragments** provides one processed, tabix-indexed BED file per GEO sample accession. Each record gives a chromosome, zero-based start and end, cell barcode, and supporting read-pair count including duplicates. Coordinates use GRCh38/hg38. Across the 72 resources, complete barcode histograms contain 5,049,496 distinct sample–barcode pairs, of which 499,514 have cell annotations and 4,549,982 are fragment-only. For cell type–resolved analysis, match column 4 to `barcode` within the same GEO `sample_id`.

    **cell\_meta\_data** contains one row per annotated adult nucleus in `barcode_namespace.csv.gz`, derived from the GEO metadata. The `class` and `cell_type` columns agree in all rows and contain 111 labels with no unassigned cells. The table includes the deposited QC fields `logUMI` and `tsse` (transcription start site enrichment). Use `sample_id` plus `barcode` as a unique key, because barcode sequences recur across accessions. The unique `cellID` combines the original `sample` name and barcode with `+`. The `sample` field is the corresponding `sample_id2` from the sample table with an appended `_1`.

    **pseudobulk\_atac** contains 111 adult and 111 fetal GRCh38/hg38 bigWig tracks for browsing aggregate accessibility at genomic loci. Fetal track names start with `Fetal_`. Table S3 provides cell-type abbreviations and cluster annotations. Some spellings, punctuation, and suffixes differ from the track names. Use the CATlas track names to select the browser signal. CATlas describes the tracks as normalized fragment pileups. The exact normalization of the local bigWigs was not independently established. [CATlas Human Multi-tissues](https://catlas.org/catlas/dataset_resource.php?ID=humantissues)

    **samples\_meta\_data** contains one row per GEO accession in `samples_namespace.csv.gz`. Join `sample_id` to the fragment resource name and the cell table. The sample table's `donor_id` groups records by participant and provides a key for donor age, sex, and tissue source. In fragment resource labels, `donor_id` holds a GEO-linked BioSample accession, which is specific to each record in this collection. For example, `GSM5589414` and `GSM5589415` have separate BioSample accessions and both map to Donor 5 (UMB4540).

    **supplementary\_table** contains six publication workbooks. S1 describes donor characteristics, tissue contributions, and assay feasibility. S2 reports sample-level QC and SRA experiment accessions. Join its `Sample ID` to `sample_id2` in the sample table. All 72 local record identifiers match S2. Its `Nuclei passing QC` count differs from the local annotation count for every matched record (487,735 passing QC in S2 and 499,514 annotated nuclei locally in total). S3 covers adult and fetal clusters, subclusters, and abbreviations. Ten adult label strings differ between its `Subcluster Annotation` column and the cell annotations, including `CNS / Enteric Neuron` in S3 and `CNS,Enteric Neuron` in the cell table. S4 contains stratified LD score regression coefficient p-values for 240 traits. S5 lists fine-mapped GWAS variants with posterior probabilities of association, overlapping cCREs, predicted motif changes, and candidate target genes. Its SNP coordinates are hg19 and its cCRE coordinates are hg38. S6 documents the sci-ATAC-seq oligos and primers.
