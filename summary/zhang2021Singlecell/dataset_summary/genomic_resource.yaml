type: basic

meta:
  summary: Zhang et al., A single-cell atlas of chromatin accessibility in the human genome, Cell, 2021
  description: |
    Zhang and colleagues profiled open chromatin in postmortem human tissues to identify candidate cis-regulatory elements (cCREs) and map their accessibility by cell type. The paper reports 615,998 quality-filtered adult nuclei from 92 biosamples spanning 30 tissue types. Integrating adult profiles with previously published data from 15 fetal tissue types yielded an atlas of more than 1.3 million nuclei and 1,154,611 cCREs across 222 cell types. The authors used these maps to identify cell-type-specific enrichment of noncoding variants associated with complex traits and diseases.

    The study used combinatorial indexing single-nucleus ATAC-seq (sci-ATAC-seq), with Illumina NextSeq 500 and HiSeq 4000 sequencing. The GRR contains 72 adult fragment resources from [GEO series GSE184462](https://www.ncbi.nlm.nih.gov/geo/query/acc.cgi?acc=GSE184462) and annotations for 499,514 adult nuclei across 111 cell types. The sample table records 26 tissue labels and five donors aged 25–54. Four donors came from ENTEx, and the fifth contributed both frontal cortex records through the NIH NeuroBioBank. The 222 cell-type accessibility tracks span both life stages. Single-nucleus profiles from the previously published fetal and adult cohorts, as well as the RNA-seq data used for comparison, are available separately.

    [Zhang *et al.*, A single-cell atlas of chromatin accessibility in the human genome, Cell, 2021.](https://doi.org/10.1016/j.cell.2021.10.024)

