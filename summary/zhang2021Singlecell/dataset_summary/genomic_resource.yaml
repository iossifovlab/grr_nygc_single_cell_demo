    **atac\_fragments** contains one tabix-indexed BED file per GEO sample accession. The GRR reads the chromosome, zero-based fragment start and end, barcode, and supporting read-pair count, which includes duplicates. Coordinates use GRCh38/hg38. The complete per-barcode histograms contain 5,049,496 distinct sample–barcode pairs. Of these, 499,514 have cell annotations and 4,549,982 appear only in the fragment files. For cell type–resolved analyses, match the fourth BED column to `barcode` within the same GEO `sample_id`.

    **cell\_meta\_data** contains one row per annotated adult nucleus. The `class` and `cell_type` columns agree on all rows and contain 111 labels. The table includes the deposited quality metrics `logUMI` and `tsse` (transcription start site enrichment). Barcode strings recur across GEO accessions, so use `sample_id` and `barcode` together as the join key. The unique `cellID` combines `sample` and `barcode` with a plus sign. The cell table's `tissue` field stores the sample name from `sample_id2`. Join to the sample table for anatomical tissue labels.

    **pseudobulk\_atac** contains 111 adult and 111 fetal bigWig tracks for viewing cell-type accessibility at genomic loci in hg38. Fetal track names begin with `Fetal_`. Supplementary Table S3 provides cluster annotations and abbreviations, and the track names are the identifiers used to select browser signals. CATlas describes its signals as fragment pileups normalized per million reads. [CATlas Human Multi-tissues](https://catlas.org/catlas/dataset_resource.php?ID=humantissues)

    **samples\_meta\_data** includes one row per GEO accession with tissue, donor age and sex, tissue source, and study identifiers. Join its `sample_id` to the ATAC resource name and the cell table. Use its `donor_id` to group records by participant. In the fragment resource labels, `donor_id` holds a GEO-linked BioSample accession. For example, the two frontal cortex accessions have separate BioSample accessions and both map to Donor 5 in the sample table.

    **supplementary\_table** contains six publication workbooks. S1 describes the donors and tissue contributions. S2 reports sample QC and SRA accessions. Its `Sample ID` matches `sample_id2` for all 72 local records. On those records, S2 reports 487,735 nuclei passing QC and the GRR has 499,514 annotated nuclei. S3 gives adult and fetal cluster labels and abbreviations. Ten adult labels differ in spelling, formatting, or wording from the cell table, so check the names before joining. S4 gives negative log10 p-values from stratified LD score regression for 240 traits. S5 links fine-mapped GWAS variants to overlapping cCREs, predicted motif changes, and candidate genes. It uses hg19 for variant coordinates and hg38 for cCRE coordinates. S6 documents the assay oligos and primers.
