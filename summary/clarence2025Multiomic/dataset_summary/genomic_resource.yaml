type: basic

meta:
  summary: Clarence et al., Multiomic single-cell profiling identifies critical regulators of postnatal brain, Nature Genetics, 2025.
  description: |
    Clarence and colleagues studied how gene expression and chromatin accessibility change during postnatal human brain development. After accounting for differences between donors, age explained more variation in both molecular profiles than brain region, while brain region explained the most variation in cell-type composition. Pseudotime analysis identified distinct regulatory programs along the oligodendrocyte lineage.

    The authors used 10x Chromium Single Cell Multiome to measure RNA and chromatin accessibility in the same nuclei and sequenced the libraries on an Illumina NovaSeq 6000. The GRR contains paired RNA and ATAC data for 101,924 QC-filtered nuclei from 39 postmortem tissue samples and 10 control donors across anterior cingulate cortex, dorsolateral prefrontal cortex, hippocampal formation and caudate nucleus. Two donors represent each of five postnatal stages (infancy, middle childhood, adolescence, early adulthood and late adulthood). The authors predicted enhancer–promoter links with the activity-by-contact (ABC) model, integrating chromatin accessibility and Hi-C data. They used RNAscope to validate oligodendrocyte-lineage subtypes. The GRR includes the predicted links and subtype marker tables. The Hi-C contact maps and RNAscope images are external to this GRR.

    [Clarence *et al.*, Multiomic single-cell profiling identifies critical regulators of postnatal brain, Nature Genetics 57, 591–603 (2025).](https://doi.org/10.1038/s41588-025-02083-8)

