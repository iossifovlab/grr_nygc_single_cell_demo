    **10x\_multiomics\_cell\_meta\_data** contains one row per nucleus. The `barcode` field matches the AnnData observation index and the fourth column in the ATAC fragments for all 101,924 nuclei. Keep the sample prefix and `-1` suffix in the full ID `<sample_id>_<16-base barcode>-1`, since short barcodes recur across samples. The `class` and `cell_type` fields agree with AnnData's `cell_type`. The paper describes 10 main cell types. The deposit uses 11 labels, including `perivascular cell` for 4,552 nuclei and a separate `pericyte` label.

    **atac\_fragments** contains one pooled, tabix-indexed TSV with zero-based, end-exclusive fragment coordinates, a full nucleus barcode, and a read-support count. GRR statistics record 2,189,583,806 fragment rows across 39 contigs and a summed read support of 3,593,002,180. The intervals use GRCh38 coordinates. The GRR associates this resource with its GRCh38.p13 reference.

    **rna\_expression\_matrix** is a single AnnData file with 101,924 nuclei and 35,451 Ensembl gene features. The file has sparse `.X` and `.raw.X` matrices for the same filtered cohort, with annotations for donor, sex, disease, developmental stage, tissue, and cell type. Embeddings include Harmony PCA, RNA UMAPs, and joint RNA–ATAC weighted-nearest-neighbor UMAPs. Use `obs_names` to join the RNA observations to the cell and fragment barcodes. The file comes from the [CZ CELLxGENE Discover collection](https://cellxgene.cziscience.com/collections/f406a653-c079-4bf9-aab6-85846c27571d).

    **samples\_meta\_data** contains one row per regional tissue sample. Join `sample_id` to the cell metadata for donor, sex, disease, tissue, and developmental stage. All 39 sample IDs are represented in the cell table. Disease status is `normal` and self-reported ethnicity is `unknown` for all 39 samples. The eight developmental-stage labels in the deposit cover infancy and ages 4, 6, 14, 20, 39, 61, and 62 years. Three regions contribute 10 samples each, and the caudate nucleus contributes nine. The caudate record for donor `postnatB_3` is absent from this release.

    **supplementary\_table** contains 24 configured resources from Supplementary Data 1–16. S1 contains gene and peak markers and donor- and sample-level QC. Its `donorN` and `sampleN` identifiers need a crosswalk to the deposited metadata. S2 covers gene-set enrichment for expression variation associated with covariates. S3–S7 cover enhancer-driven regulons, regulon specificity, and GWAS enrichment. S8–S12 cover predicted enhancer–promoter links at GWAS loci, pathway enrichment, and candidate gene summaries. In S9, use the original workbook's `Summary` sheet for the section and column headers. S13–S16 cover oligodendrocyte-lineage markers, Hotspot module scores, pseudotime enrichment, and MAGMA results. S14 uses short `cell_id` barcodes that repeat and only partially overlap the shortened GRR barcodes, so a nucleus-level join needs a source crosswalk.
