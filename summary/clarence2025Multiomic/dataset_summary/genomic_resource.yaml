type: basic

meta:
  summary: >-
    Clarence et al., Multiomic single-cell profiling identifies critical regulators of postnatal brain, Nature Genetics, 2025
  description: |
    Clarence and colleagues investigated how gene expression and chromatin accessibility change from infancy to late adulthood in the human brain. Their analysis identified distinct regulatory programs along the oligodendrocyte lineage. The authors combined chromatin accessibility with Hi-C contact maps to predict enhancer–promoter links at loci associated with ten brain disorders and used RNAscope to validate oligodendrocyte-lineage subtypes.

    The study used 10x Chromium Single Cell Multiome to measure RNA and ATAC in the same nuclei. The GRR contains paired measurements for 101,924 nuclei that passed quality control in both assays, from 39 postmortem tissue samples and 10 control donors. The samples span five postnatal stages across the anterior cingulate cortex, dorsolateral prefrontal cortex, hippocampal formation, and caudate nucleus. The GRR includes the predicted enhancer–promoter links and subtype marker tables alongside the single-nucleus data.

    [Clarence *et al.*, Multiomic single-cell profiling identifies critical regulators of postnatal brain, Nature Genetics 57, 591–603 (2025).](https://doi.org/10.1038/s41588-025-02083-8)

