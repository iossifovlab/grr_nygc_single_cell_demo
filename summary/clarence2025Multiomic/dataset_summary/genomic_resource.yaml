    **10x\_multiomics\_cell\_meta\_data** contains one row per retained nucleus. Join its unique `barcode` to the AnnData observation index and to the fourth column of the ATAC fragments. All three contain the same 101,924 full IDs. Keep the sample prefix and `-1` suffix in IDs of the form `<sample_id>_<16-base barcode>-1`, since short barcodes can recur in different samples. For all 101,924 matched barcodes, the CSV fields `class` and `cell_type` carry the same label as AnnData `obs['cell_type']`. The deposit uses 11 cell-type labels with no unassigned nuclei. It includes 4,552 nuclei labeled `perivascular cell` alongside a distinct `pericyte` label, while the paper describes 10 main types.

    **atac\_fragments** contains one pooled, bgzip-compressed and tabix-indexed TSV with zero-based, end-exclusive intervals, a full nucleus barcode and a read-support count. The GRR statistics record 2,189,583,806 fragment rows across 39 contigs and a summed read support of 3,593,002,180. The GRR uses `reference/Human/genome/GRCh38.p13` as its reference resource for these GRCh38 coordinates. The alignment patch version is unspecified in the deposit.

    **rna\_expression\_matrix** contains one CELLxGENE AnnData file with RNA measurements for 101,924 nuclei across 35,451 human gene features indexed by Ensembl IDs. It stores sparse `.X` and `.raw.X` matrices for the same filtered cohort. The processing applied to the deposited `.X` values is unspecified in the file metadata. Observation annotations include cell-type and tissue ontology terms, donor, sex, disease and developmental stage. Embeddings include Harmony PCA, RNA UMAPs and joint RNA–ATAC weighted-nearest-neighbor UMAPs. Use `.obs_names` as the barcode key. [CZ CELLxGENE Discover collection](https://cellxgene.cziscience.com/collections/f406a653-c079-4bf9-aab6-85846c27571d)

    **samples\_meta\_data** contains one row per regional tissue sample. Join on `sample_id` from the nucleus metadata to obtain `donor_id`, tissue, sex, disease and developmental stage. All 39 sample IDs match. Each sample is labeled `normal` and self-reported ethnicity is `unknown`. The eight deposited developmental-stage labels correspond to infancy and ages 4, 6, 14, 20, 39, 61 and 62 years. There are 10 samples each from anterior cingulate cortex, dorsolateral prefrontal cortex and hippocampal formation, and nine from caudate nucleus. The caudate sample for `postnatB_3` is absent from the deposit.

    **supplementary\_table** contains 24 configured resources from Supplementary Data 1–16. S1 has four resources for gene and peak markers and donor- and sample-level QC. The QC sheets use `donorN` and `sampleN` identifiers that require a crosswalk to the metadata above. S2 covers gene-set enrichment for covariate-associated expression variation. S3–S7 cover SCENIC+ enhancer-driven regulons, regulon specificity and GWAS enrichment. S8–S12 contain predicted enhancer–promoter links at GWAS loci, pathway enrichment and per-gene summaries. The S9 workbook spans ten traits. Consult the original S9 Summary sheet for its section and column headers. S13–S16 cover oligodendrocyte-lineage markers, Hotspot module scores, pseudotime enrichment and MAGMA results. S14 `cell_id` uses short barcodes that repeat. Some S14 IDs are absent even after removing sample prefixes from GRR barcodes, so a reliable nucleus-level join requires a source crosswalk.

