type: basic

meta:

  summary: |
    Liu et al, Human Development Multiomic Atlas, Nature 2026

  description: |

    The study presents a single-cell multiomic atlas of human fetal development across 12 organs—adrenal gland, brain, eye, heart, liver, lung, muscle, skin, spleen, stomach/oesophagus, thymus, and thyroid—spanning post-conception weeks 10 to 23. It characterizes how gene expression and chromatin accessibility vary across developing tissues and cell populations, providing a broad view of the molecular and regulatory programs that shape human development.

    The study uses SHARE-seq, which jointly measures RNA expression and ATAC chromatin accessibility in the same cells. The final atlas contains 817,740 cells from 76 tissue samples obtained from 23 individuals. Cells were classified into 203 detailed cell clusters across the 12 organs. In this resource, pseudobulk accessibility-related tracks are provided for 186 of these clusters.

    [Liu et al, Human Development Multiomic Atlas, Nature 2026.](https://www.nature.com/articles/s41586-026-10326-9)

