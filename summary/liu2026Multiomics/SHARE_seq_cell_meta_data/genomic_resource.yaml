file: liu2026_annotated_barcode_namespace.csv.gz
format: csv
type: data_frame

meta:
  summary: Cell barcodes and cell-type annotations for Liu 2026

  description: |
    Author-provided per-cell metadata
    ([Zenodo record 15200418](https://zenodo.org/records/15200418))
    were used as the source of cell identifiers and Cluster assignments.
    Each identifier was split at the "#" separator to obtain the sample name
    and cell barcode, while the original identifier was retained as
    cb\_Zenodo.

    [Supplementary Table S2](https://greenleaflab.github.io/HDMA/tables/)
    was used as the cluster annotation lookup. Each Cluster was mapped to
    L1\_annot, L2\_annot, and L3\_annot. The cluster sets in the per-cell
    metadata and Supplementary Table S2 are checked to match exactly during
    processing.

    The resulting table contains 817,740 annotated cells from 76 samples,
    representing 203 clusters, 203 L1 annotations, 134 L2 annotations, and
    37 L3 annotations.

    Representative rows from the output table are shown below:

    | sample | cb\_Zenodo | barcode | Cluster | L1\_annot | L2\_annot | L3\_annot |
    | --- | --- | --- | --- | --- | --- | --- |
    | T166\_b15\_Liver\_PCW19 | T166\_b15\_Liver\_PCW19#CL105\_H01+A01+A01 | CL105\_H01+A01+A01 | LI\_2 | LI\_2\_erythroblast 1 | Liver erythroblast | erythroblasts |
    | T166\_b15\_Liver\_PCW19 | T166\_b15\_Liver\_PCW19#CL105\_H01+A01+C01 | CL105\_H01+A01+C01 | LI\_0 | LI\_0\_cycling erythroblast | Liver cycling erythroblast | erythroblasts |
    | T166\_b15\_Liver\_PCW19 | T166\_b15\_Liver\_PCW19#CL105\_H01+A01+E02 | CL105\_H01+A01+E02 | LI\_3 | LI\_3\_hepatocyte 2 | Liver hepatocyte | hepatocytes |

    Extended validation confirmed that all 817,740 annotated barcodes were
    present in their corresponding RNA-expression matrix resources and all
    817,740 were also found in the corresponding ATAC-fragment resources,
    with no missing barcodes in either modality.

    Prepared on 2026-09-28.

    Processing details: The table can be regenerated by running
    barcodes\_liu26.py using per\_cell\_meta.csv and S2.xlsx. This produces
    liu2026\_annotated\_barcode\_namespace.csv. The extended validation can
    be rerun by setting RUN\_EXTENDED\_VALIDATION = True in the script;
    it requires the GAIn environment and access to the GRR and may take
    substantial time because ATAC-fragment resources are checked across
    all 76 samples.