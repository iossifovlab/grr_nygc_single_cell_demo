meta:
    summary: wang2025Molecular
    description: |
        Wang et al. present a single-nucleus multiomic atlas of the developing human neocortex, spanning prenatal development through adolescence. The study examines changes in cell populations and gene-regulatory programs across developmental stages and cortical regions, with particular attention to the differentiation of neural progenitors into neuronal and glial populations.

        Using 10x Multiome, the authors jointly measured RNA expression and chromatin accessibility in the same nuclei. The GRR contains data for 232,328 nuclei from 38 samples collected from 27 donors, spanning five developmental stages: first trimester, second trimester, third trimester, infancy, and adolescence. Samples are annotated by prefrontal cortex (PFC), primary visual cortex (V1), or a general cortical region. The RNA expression matrix contains 35,477 genes, with cells organized into six classes, 12 subclasses, 34 types, and 176 clusters.

        [Wang et al., Molecular and cellular dynamics of the developing human neocortex at single-cell resolution, Nature, 2025](https://www.nature.com/articles/s41586-024-08351-7)

