        The data are organized into five main resource groups. **rna\_expression\_matrix** contains a single AnnData resource with RNA expression measurements for 232,328 nuclei across 35,477 genes. Cell annotations include donor and sample identifiers, developmental stage, brain region, and a hierarchical cell taxonomy comprising six classes, 12 subclasses, 34 types, and 176 clusters.

        **atac\_fragments** contains a single resource with chromatin-accessibility fragments generated by 10x Multiome. Each fragment record specifies genomic coordinates, a cell barcode, and a count. The fragment barcodes can be linked to cell-type and sample annotations through **10x_multiomics\_cell\_meta\_data**.

        **10x\_multiomics\_cell\_meta\_data** contains cell-level annotations for the 232,328 nuclei, including barcodes, sample and donor identifiers, developmental stages, brain regions, and cell-type classifications. Its barcodes and sample assignments correspond exactly to those in the RNA expression matrix.

        **samples\_meta\_data** contains metadata for the 38 samples collected from 27 donors, including donor identifiers, developmental stage, brain region, tissue, sex, ethnicity, and disease annotations. The sample identifiers, donor assignments, developmental stages, and brain regions correspond to those in the RNA expression matrix.

        The **supplementary\_table** collection contains 59 resources corresponding to supplementary tables S1–S25 and their subdivisions. These include sample and cell metadata, cell-type markers, spatial transcriptomics analyses, cell-cell communication results, gene-regulatory network analyses, developmental trajectories, progenitor experiments, and associations with cognitive traits and brain disorders.

