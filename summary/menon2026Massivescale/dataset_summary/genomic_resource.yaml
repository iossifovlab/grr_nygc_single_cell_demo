    **atac\_fragments** contains one tabix-indexed fragment table per donor and brain region. Records give the chromosome, zero-based fragment coordinates, the library-prefixed barcode, and the read-support count. Use the IGVF file accession in each resource name to look up `IGVF_ATAC_ProcessedFragmentFileAccession` in Supplementary Table 11. The resource labels `donor_id` and `brain_region` match `donor_id` and `region` in the sample table. For nucleus-level comparisons, a fragment barcode in the form `library|barcode-1` corresponds to `library#barcode-1` in the RNA and cell metadata namespace. Keep the library prefix and barcode suffix, then check overlap within each sample. ATAC coverage varies across samples and some barcodes occur in only one modality.

    **rna\_expression\_matrix** contains the complete [CELLxGENE RNA release](https://cellxgene.cziscience.com/collections/16876983-d454-43db-a8ec-77fafca9bf38) as a single AnnData file with 4,502,568 nuclei and 25,183 gene features. The file includes a UMAP embedding and a separate `.raw` expression matrix. Observation annotations include donor, brain region, disease status, and cell type. Join AnnData `obs_names` to the `barcode` column in the cell metadata using the full identifier.

    **10x\_multiomics\_cell\_meta\_data** has one row for each RNA nucleus. It includes the full barcode, sample and donor identifiers, region, tissue, 30 author cell-type labels in `author_cell_type`, and 27 standardized labels in `cell_type`. The `class` column repeats `cell_type`. Join `sample_id` to the sample metadata to add donor-level attributes.

    **samples\_meta\_data** has one row per donor-region combination and uses `donor_id` and `region` joined by an underscore as `sample_id`. It provides disease status, age stage, sex, tissue, and both study and IGVF donor identifiers. Use `donor_id` to group the five tissue samples contributed by each person.

    **supplementary\_table** contains 14 spreadsheet resources. The three `Supplementary_Data` sheets provide expression and chromatin-accessibility QTL results and a summary of expression QTL tests across genotype principal-component settings. The 11 `Supplementary_Table` sheets cover donor characteristics, differential expression and accessibility, pathway enrichment, disease-stage trajectories, rare-variant associations, and variant prioritization. Supplementary Table 11 maps tissue samples to IGVF accessions for the deposited data.
