meta:
  summary: >-
    Menon et al., Massive-scale single-nucleus multi-omics identifies novel rare noncoding drivers of Parkinson’s disease, bioRxiv, 2026
  description: |
    Menon and colleagues profiled postmortem human brain tissue to investigate how Parkinson’s disease and rare noncoding variants affect gene regulation in specific cell types. They mapped genetic associations with gene expression and chromatin accessibility, and nominated candidate regulatory targets including *FAHD1*. The study also used whole-genome sequencing and cell-type-specific Micro-C to investigate variant effects and link regulatory elements to genes.

    The study used 10x Multiome on 505 samples from 101 donors, including 80 people with Parkinson’s disease and 21 neurologically normal controls. Each donor contributed tissue from the cerebellum, cingulate gyrus, middle temporal gyrus, putamen, and substantia nigra. The preprint reports about 3.3 million nuclei that passed quality control for both RNA and ATAC. The GRR contains the broader RNA atlas with 4,502,568 nuclei and matched metadata, 505 sample-level ATAC fragment resources, and processed supplementary results.

    [Menon et al., Massive-scale single-nucleus multi-omics identifies novel rare noncoding drivers of Parkinson’s disease, bioRxiv, 2026 (preprint v1)](https://www.biorxiv.org/content/10.64898/2026.03.05.709922v1)

