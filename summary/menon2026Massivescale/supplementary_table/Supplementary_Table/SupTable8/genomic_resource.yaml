file: Supplementary_Table_SupTable8.xlsx
format: excel
meta:
  description: "Each row represents an peak\n\n| Column Name       | Description \
    \                                                                            \
    \            |\n| ----------------- | ---------------------------------------------------------------------------------------------------\
    \ |\n| `SetID`           | Identifier for the variant set being tested (e.g.,\
    \ gene name or region ID).                         |\n| `celltype`        | The\
    \ cell type or sample group in which the SKAT-O test was performed.          \
    \                     |\n| `P.value`         | SKAT-O p-value for association\
    \ between the variant set and the phenotype.                           |\n| `N.Marker.All`\
    \    | Total number of variants in the set before filtering.                 \
    \                              |\n| `N.Marker.Test`   | Number of variants that\
    \ were actually used in the SKAT-O test (after QC, MAF, etc.).               \
    \ |\n| `MAC`             | Minor allele count across all samples for the variants\
    \ included in the test.                        |\n| `m`               | Number\
    \ of variants included in the kernel test (equivalent to N.Marker.Test).     \
    \                  |\n| `Method.bin`      | Method used for burden vs SKAT weighting\
    \ decision (binning procedure used within SKAT).             |\n| `MAP`      \
    \       | Minimum p-value across single-variant tests within the set (used in\
    \ SKAT\u2010O for hybrid statistic).   |\n| `global_sig`      | Indicates whether\
    \ this set is statistically significant at the global test level.            \
    \       |\n| `celltype_sig`    | Indicates whether the association is significant\
    \ **within this specific cell type**                 |\n| `target_gene`     |\
    \ the gene that the peak maps to                                             \
    \                         |\n| `mapped_status`   | whether or not the peak mapped\
    \ to a gene                                                            |\n| `Sig_GeneSetRVAT`\
    \ | if the mapped gene is cell type significant in gene set RVAT             \
    \                           |"
