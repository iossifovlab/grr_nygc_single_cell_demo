meta:
  description: 'Each row represents a pathway


    | Column Name        | Description                                                                                                                  |

    | ------------------ | ----------------------------------------------------------------------------------------------------------------------------
    |

    | `cell_type`        | cell type tested                                                                                                             |

    | `Term`             | pathway tested                                                                                                               |

    | `Rank`             | Enrichment rank of pathway by celltype                                                                                       |

    | `P.value`          | significance level of enrichment                                                                                             |

    | `Adjusted.P.value` | adjusted pvalue                                                                                                              |

    | `Odds.Ratio`       | odds ratio of genes overlap with set                                                                                         |

    | `Combined.Score`   | A metric used by Enrichr combining the p-value and z-score
    for deviation from expected rank; higher = stronger enrichment.   |

    | `Genes`            | Comma-separated list of genes that overlap with the given
    pathway                                                            |

    | `db`               | Pathway database tested                                                                                                      |

    | `n_genes`          | number of genes in foreground                                                                                                |

    | `n_background`     | number of genes in background                                                                                                |'
